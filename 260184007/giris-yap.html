<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"> <!-- Türkçe karakterlerin bozulmasını engeller -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Telefonda düzgün görünmesini sağlar -->
    <title>Giriş Yap - CanBağı</title>
    
</head>
<body>

    <!-- Üst kısım: logo, site adı ve ana sayfaya dönüş -->
    <header class="site-header">
        <img src="assets/images/LOGO.png" alt="CanBağı logosu" class="site-logo" width="80">
        <h1>CanBağı</h1>
        <a href="index.html">Ana Sayfaya Dön</a> <!-- <a>: Tıklanabilir bağlantı oluşturur -->
    </header>

    <hr>

    <main> <!-- Sayfanın ana içerik bölümünü başlatır -->

        <!-- Kayıt formu -->
        <section class="register-section"> <!-- Sayfada ayrı bir bölüm oluşturur -->
            <fieldset>                     <!-- Guruplayıp çerçeve oluşturur -->
                <legend><h2>Kayıt Ol</h2></legend>

                <form id="register-form"> <!-- Kullanıcı kayıt formunu başlatır -->
                    <p>
                        <label for="full-name">Ad Soyad:</label><br>  <!-- label: Giriş alanının adını belirtir -->
                        <input type="text" id="full-name" required placeholder="Adınız Soyadınız"> <!-- required: Alanın doldurulmasını zorunlu yapar -->
                    </p>                                                                           <!-- placeholder: Kullanıcıya örnek giriş gösterir -->
                    <p>
                        <label for="register-email">E-posta:</label><br>      <!-- type="email": E-posta giriş alanı oluşturur ve biçimini kontrol eder -->
                        <input type="email" id="register-email" required placeholder="ornek@mail.com">
                    </p>
                    <p>
                        <label for="phone">Telefon:</label><br>
                        <input type="tel" id="phone" required placeholder="05XXXXXXXXX"              
                               pattern="05[0-9]{9}" title="05 ile başlayan 11 haneli numara yazın"> <!-- pattern: Girilecek telefon numarasının biçimini belirler -->
                    </p>                                                                            <!-- 05[0-9]{9}: Numaranın 05 ile başlamasını ve ardından 9 rakam gelmesini ister -->
                    <p>
                        <label for="gender">Cinsiyet:</label><br>
                        <select id="gender" required>             <!-- select: Açılır liste oluşturur -->
                            <option value="">Seçiniz</option>     <!-- required: Seçim yapılmasını zorunlu tutar -->
                            <option value="kadın">Kadın</option>  <!-- option: Açılır listedeki seçenekleri oluşturur -->
                            <option value="erkek">Erkek</option>  <!-- value: Seçilen seçeneğin programlama tarafında kullanılacak değeridir -->
                            <option value="trans">Trans</option>
                            <option value="belirtmek-istemiyorum">Belirtmek istemiyorum</option>
                        </select>
                    </p>
                    <p>
                        <label for="register-password">Şifre oluştur:</label><br>
                        <input type="password" id="register-password" required minlength="6" placeholder="En az 6 karakter">
                    </p>   <!-- password: Yazılan şifreyi gizler -->
                    <p>
                        <label for="password-repeat">Şifreyi tekrar gir:</label><br>
                        <input type="password" id="password-repeat" required minlength="6">
                    </p>  <!-- Kullanıcının oluşturduğu şifreyi tekrar girmesini sağlar -->
                    <p>
                        <button type="submit">Kayıt Ol</button>
                    </p>
                    <p id="register-message"></p> <!-- Kayıt sonucu mesajı buraya yazılır -->
                </form>
            </fieldset>
        </section>

        <br>

        <!-- Giriş formu -->
        <section class="login-section">
            <fieldset>
                <legend><h2>Giriş Yap</h2></legend>

                <form id="login-form">
                    <p>
                        <label for="login-email">E-posta:</label><br>   <!-- for="login-email": Etiketi ilgili giriş alanına bağlar -->
                        <input type="email" id="login-email" required placeholder="ornek@mail.com"> <!-- placeholder: Kullanıcıya örnek e-posta gösterir -->
                    </p>
                    <p>
                        <label for="login-password">Şifre:</label><br>       
                        <input type="password" id="login-password" required>
                    </p>
                    <p>Kalan giriş hakkı: <span id="remaining-attempts">5</span></p> <!-- <span>: Metnin belirli bir bölümünü ayrı olarak tanımlar -->
                    <p>
                        <button type="submit" id="login-button">Giriş Yap</button>  <!-- type="submit": Tıklandığında formu gönderir -->
                    </p>
                    <p id="login-message"></p> <!-- Giriş sonucu mesajı buraya yazılır -->
                </form>
            </fieldset>
        </section>

    </main>

    <br>

    <!-- Sayfa alt bilgisi -->
    <footer class="site-footer">
        <img src="assets/images/LOGO.png" alt="CanBağı logosu" width="40">
        <p>© 2026 CanBağı. Tüm hakları saklıdır.</p>
        <p>Hazırlayan: Kübra ORDU</p>
        <p>İletişim: ornek@mail.com</p>
    </footer>

    <!-- JavaScript dosyası en sonda bağlanır -->
    <script src="js/auth.js"></script>

</body>
</html>

<!DOCTYPE html> 
<html lang="tr"> 
<head> 
    <meta charset="UTF-8"> <!-- charset: Türkçe karakterlerin bozulmamasını sağlar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- viewport: sayfanın telefonda ekrana sığmasını sağlar -->
    <title>İlan Ara - CanBağı</title> 

</head>
<body> 

    <!-- Üst kısım: logo, site adı ve ana sayfaya dönüş -->
    <header class="site-header"> 
        <img src="assets/images/LOGO.png" alt="CanBağı logosu" class="site-logo" width="80"> 
        <h1>CanBağı</h1> 
        <a href="index.html">Ana Sayfaya Dön</a> <!-- a: bağlantı. href: gidilecek sayfa -->
    </header>

    <hr> 

    <main> 

        <!-- Arama formu -->
        <section class="search-form-section"> 
            <fieldset> <!-- fieldset: etrafına çerçeve çizer -->
                <legend><h2>İlan Ara</h2></legend> <!-- legend: çerçevenin başlığı -->

                <form id="search-form"> <!-- form: bilgi alma formu. id: JavaScript'in bulması için isim -->

                    <p> 
                        <label for="search-type">İlan türü:</label><br> <!-- label: kutunun adı. for: hangi kutuya ait -->
                        <select id="search-type"> <!-- select: açılır liste -->
                            <option value="">Hepsi</option> <!-- option: listedeki seçenek. value="": boş, yani filtre yok -->
                            <option value="Kan">Kan</option>
                            <option value="Kök hücre">Kök hücre</option>
                            <option value="Kemik iliği">Kemik iliği</option>
                            <option value="Organ">Organ</option>
                        </select>
                    </p>

                    <p>
                        <label for="search-blood-group">Kan grubu:</label><br> 
                        <select id="search-blood-group"> <!-- Kan grubu açılır listesi -->
                            <option value="">Hepsi</option>
                            <option value="A Rh+">A Rh+</option>
                            <option value="A Rh-">A Rh-</option>
                            <option value="B Rh+">B Rh+</option>
                            <option value="B Rh-">B Rh-</option>
                            <option value="AB Rh+">AB Rh+</option>
                            <option value="AB Rh-">AB Rh-</option>
                            <option value="0 Rh+">0 Rh+</option>
                            <option value="0 Rh-">0 Rh-</option>
                            <option value="Fark etmez">Fark etmez</option>
                        </select>
                    </p>

                    <p>
                        <label for="search-city">Şehir:</label><br> 
                        <input type="text" id="search-city" placeholder="Örn: İstanbul"> <!-- input: yazı kutusu. type="text": düz yazı. placeholder: kutudaki silik örnek -->
                    </p>

                    <p>
                        <label for="search-district">İlçe:</label><br> 
                        <input type="text" id="search-district" placeholder="Örn: Avcılar"> <!-- İlçe yazı kutusu -->
                    </p>

                    <p>
                        <label for="search-urgency">Aciliyet:</label><br> 
                        <select id="search-urgency"> <!-- Aciliyet açılır listesi -->
                            <option value="">Hepsi</option>
                            <option value="Normal">Normal</option>
                            <option value="Acil">Acil</option>
                            <option value="Çok acil">Çok acil</option>
                        </select>
                    </p>

                    <p>
                        <button type="submit">Ara</button> <!-- type="submit": formu gönderir -->
                    </p>
                </form>
            </fieldset>
        </section>

        <br> 

        <!-- Arama sonuçları -->
        <section id="results" class="results-section"> <!-- id="results": arama yapınca sayfa buraya kayar -->
            <fieldset> <!-- Çerçeve -->
                <legend><h2>Sonuçlar</h2></legend> 
                <p id="result-message"></p> <!-- Kaç ilan bulunduğu buraya yazılır. id: JavaScript'in bulması için -->
                <ul id="result-list"></ul> <!-- ul: noktalı liste. Bulunan ilanlar buraya eklenir -->
            </fieldset>
        </section>

                <br>

        <!-- Yanıt formu: başta gizli, "İlan Yanıtla" butonuna basınca açılır -->
        <form id="reply-form" hidden> <!-- form: bilgi alma formu. hidden: başta görünmez -->
            <fieldset> <!-- fieldset: etrafına çerçeve çizer -->
                <legend><h2>İlana Yanıt Ver</h2></legend> 

                <p id="reply-ad-info"></p> <!-- Yanıtlanan ilanın özeti buraya yazılır -->
                <p>Yanıtlayan: <span id="reply-name"></span></p> <!-- span: yazının bir bölümünü ayırır -->
                <p>Telefon: <span id="reply-phone"></span></p> <!-- Telefon buraya yazılır -->

                <p>
                    <label for="reply-text">Açıklama:</label><br> <!-- label: kutunun adı -->
                    <textarea id="reply-text" rows="4" cols="40" required minlength="5" maxlength="300"
                              placeholder="Nasıl yardımcı olabileceğinizi yazın"></textarea> <!-- textarea: çok satırlı yazı alanı. required: boş bırakılamaz -->
                </p><!-- placeholder: kullanıcı yazmaya başlamadan önce kutunun içinde ki örnek metin gösterir-->

                <p>                                                     <!-- input: ullanıcıdan bilgi almak için kullanılan HTML elemanıdır -->
                    <input type="checkbox" id="reply-consent" required> <!-- checkbox: onay kutusu. required: işaretlenmeden gönderilemez -->
                    <label for="reply-consent">Telefon numaramın ilan sahibiyle paylaşılmasını kabul ediyorum</label>
                </p>

                <p>
                    <button type="submit">Yanıtı Gönder</button> <!-- type="submit": formu gönderir -->
                    <button type="button" id="reply-cancel-button">Vazgeç</button> <!-- Formu kapatan düğme -->
                </p>

                <p id="reply-message"></p> <!-- Hata mesajı buraya yazılır -->
            </fieldset>
        </form>

    </main>

    <br>

    <!-- Sayfa alt bilgisi: logo, telif hakkı ve hazırlayan bilgisi -->
    <footer class="site-footer"> 
        <img src="assets/images/LOGO.png" alt="CanBağı logosu" width="40"> 
        <p>© 2026 CanBağı. Tüm hakları saklıdır.</p> 
        <p>Hazırlayan: Kübra ORDU</p> 
        <p>İletişim: ornek@mail.com</p> 
    </footer>

    <!-- JavaScript dosyası en sonda bağlanır -->
    <script src="js/ilan-ara.js"></script> <!-- script: JavaScript dosyasını sayfaya bağlar. src: dosya yolu -->

</body>
</html>
